schema_version: 1

context:
  name: easydict
  version: "1.14"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/easydict/easydict-${{ version }}.tar.gz
  sha256: 0624565381af060cd878fffda4c42164f5de723797f1e998a0a866277abadcb6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    # Match upstream's pyproject.toml build-system requirements.
    - setuptools >=77
    - setuptools-scm >=8
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - easydict
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -c "from easydict import EasyDict; assert EasyDict(dict(a=dict(b=1))).a.b == 1"
      - python -c "import importlib.metadata as m; assert m.version('easydict') == '${{ version }}'"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/makinacorpus/easydict
  repository: https://github.com/makinacorpus/easydict
  summary: Access dict values as attributes (works recursively).
  description: |
    EasyDict allows access to dictionary values as attributes and works
    recursively, providing JavaScript-like dot notation for Python mappings.
  license: LGPL-3.0-only
  license_file: LICENSE

extra:
  feedstock-name: easydict
  recipe-maintainers:
    - zhaofeng-shu33
    - jeongseok-meta
